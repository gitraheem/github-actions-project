name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches: [ main ]   # Trigger on push to main branch

jobs:
  build:
    runs-on: ubuntu-24.04  # Standard stable runner version to avoid deprecation shifts

    steps:
      # 1. Checkout code using the latest action version
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. List files to debug exactly what is inside the repository
      - name: Debug Repository Structure
        run: |
          echo "=== Listing Root Directory Files ==="
          ls -la

      # 3. Set up JDK using the modern v5 version to eliminate deprecation warnings
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 4. Build with Maven
            # 4. Build with Maven (Configured to allow missing web.xml files safely)
            # 4. Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

        

      deploy:
    runs-on: ubuntu-latest
    needs: build
    # The environment: production line has been completely removed from here

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      # 5. Upload WAR as artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      - name: Deploy WAR to Tomcat Webapps
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ${{ secrets.TOMCAT_USER }}
          key: ${{ secrets.TOMCAT_SSH_KEY }}
          source: "*.war"
          target: "/root/apache-tomcat-11.0.26/webapps/"
          strip_components: 0
